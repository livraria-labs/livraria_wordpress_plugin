name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # Blocking gate: a finding fails the check (the full history is clean as of
    # #616 — committed PII backup removed, false positives allowlisted in
    # .gitleaks.toml). Newly-committed secrets now fail the build.
    # NOTE: the gitleaks CLI is invoked directly (not gitleaks/gitleaks-action),
    # which would require a paid GITLEAKS_LICENSE for organization repos.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full git history so past commits are scanned too
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --redact --no-banner --verbose
